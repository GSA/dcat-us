name: Validate JSON Schema

on:
  pull_request:
    paths:
      - 'jsonschema/**'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install jsonschema[format]

      - name: Run JSON Schema validation tests
        run: python jsonschema/test_json_schema.py

  check-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6

      - name: Install NPM dependencies
        working-directory: ./jsonschema
        run: npm ci

      - name: Check JSON format with prettier
        working-directory: ./jsonschema
        run: npx prettier --check definitions/*.json examples/
